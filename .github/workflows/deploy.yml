---
name: deploy
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.13
          enable-cache: true
      - name: Install packages
        run: |
          uv pip install \
          --target package \
          --python-platform aarch64-manylinux_2_40 \
          --python-version 3.13 \
          --only-binary=:all: \
          munch
      - name: Create Function Code
        run: |
          cd package
          zip -r9 /tmp/function.zip .
          cd ..
          zip -g /tmp/function.zip index.py
      - name: Deploy
        uses: skaylink-stefan-heitmueller/github-action-lambda-deployment@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          zip-file: /tmp/function.zip
          runtime: python3.13
          handler: index.handler
          role-arn: arn:aws:iam::066992541702:role/AWSLambdaBasicExecutionRole
          region: eu-central-1
          name: foo
          public-url: "true"
          environment-variables: "foo=bar,bar=foo"
          architectures: arm64
